thinking:
  label: 03 — How I think
  title: How I make decisions.
  items:
    - title: AI proposes, people confirm.
      body: Agents can draft orders, build reports and suggest next steps — but anything that touches real data goes through a preview and a human confirmation.
    - title: Conversation over screens.
      body: Business users shouldn't have to memorise ten screens. They say what they need; the system finds the right operation.
    - title: Clean data first, AI second.
      body: Cleaning and standardising data is the foundation. Without it, any model just gives wrong answers faster.
    - title: Architecture sized to reality.
      body: MVP first, scale later. Running cost is a design constraint, not an afterthought.
    - title: Don't rebuild what already exists.
      body: Orchestrate existing services, integrate good open source. Save the team's energy for what only we can build.


  - name: Spark
    title: It started with one line of code.
    body: It ran. I haven't stopped since.

  - name: Flame
    title: Ten years. Still burning.
    body: From writing single functions to designing whole systems. The harder the problem, the more I want it.
    chips: [NestJS, Go, Rust, PostgreSQL, Kafka, Mobile]

  - name: Forge
    title: I don't build demos. I build things that run.
    body: From the drawing board to production, and then keeping it running.

  - name: Torch
    title: Alone is fast. Organized goes far.
    body: I no longer type every line. I design how the work runs.
    roles:
      - who: AI
        what: handles the repetitive part
      - who: The team
        what: reviews and refines
      - who: The owner
        what: makes the call
    aside: At home, I build a math app for my kid.

  - name: How I organize
    title: Five things I keep when I organize.
    principles:
      - AI proposes. People decide.
      - Repetitive work goes to AI. Judgment stays with people.
      - Clear process first, tools second.
      - MVP first, scale later.
      - Don't rebuild what already exists.

  - name: What's left to burn?
    title: Fire never asks when it gets to rest. It only asks what is left to burn.
    body: Got a hard problem? Write to me. The one who replies is me.
    contact: true


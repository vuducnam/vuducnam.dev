chapters:
  - name: Tia lửa
    title: Bắt đầu từ một dòng code.
    body: Nó chạy. Từ đó tôi không dừng lại.

  - name: Ngọn lửa
    title: Mười năm. Chưa tắt.
    body: Từ viết từng hàm đến thiết kế cả hệ thống. Bài toán càng khó, tôi càng muốn làm.
    chips: [NestJS, Go, Rust, PostgreSQL, Kafka, Mobile]

  - name: Lò rèn
    title: Tôi không làm demo. Tôi làm thứ chạy thật.
    body: Từ bản vẽ đến production, rồi giữ cho nó chạy.

  - name: Ngọn đuốc
    title: Một mình thì nhanh. Có tổ chức mới đi xa.
    body: Giờ tôi không gõ từng dòng nữa. Tôi thiết kế cách việc chạy.
    roles:
      - who: AI
        what: làm phần lặp lại
      - who: Đội
        what: kiểm tra và hoàn thiện
      - who: Người chịu trách nhiệm
        what: chốt
    aside: Ở nhà, tôi viết app học toán cho con.

  - name: Cách tổ chức
    title: Năm điều tôi giữ khi tổ chức.
    principles:
      - AI đề xuất. Con người quyết định.
      - Việc lặp lại giao cho AI. Việc cần phán đoán giữ cho người.
      - Quy trình rõ trước, công cụ sau.
      - MVP trước, mở rộng sau.
      - Không xây lại thứ đã có.

  - name: Còn gì để cháy?
    title: Lửa không hỏi khi nào được nghỉ. Nó chỉ hỏi còn gì để cháy.
    body: Có bài toán khó? Viết cho tôi. Người trả lời là tôi.
    contact: true


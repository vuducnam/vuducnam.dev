thinking:
  label: 03 — Tư duy
  title: Cách tôi ra quyết định.
  items:
    - title: AI đề xuất, con người xác nhận.
      body: Agent có thể soạn đơn, tạo báo cáo, gợi ý bước tiếp theo — nhưng hành động nào chạm vào dữ liệu thật đều đi qua bước xem trước và xác nhận.
    - title: Hội thoại thay cho màn hình.
      body: Người dùng doanh nghiệp không nên phải học thuộc mười màn hình. Họ nói điều cần làm, hệ thống tìm đúng nghiệp vụ.
    - title: Dữ liệu sạch trước, AI sau.
      body: Làm sạch và chuẩn hóa dữ liệu là nền móng. Không có nó, mô hình nào cũng chỉ trả lời sai nhanh hơn.
    - title: Kiến trúc vừa với quy mô thật.
      body: MVP trước, mở rộng sau. Chi phí vận hành là một ràng buộc thiết kế, không phải chuyện tính sau.
    - title: Không xây lại thứ đã có.
      body: Dịch vụ sẵn có thì điều phối, mã nguồn mở tốt thì tích hợp. Sức của đội dành cho phần chỉ mình làm được.


about:
  label: 01 — Tôi là ai
  title: Một người làm nghề.
  body: Ở Redsun, tôi vẽ kiến trúc, lập kế hoạch sản phẩm, và vẫn ngồi cùng dev gỡ từng vấn đề.
  side_title: Ngoài giờ làm
  side:
    - Làm bố, kiêm dev cho con — tự viết app luyện Toán lớp 5 và một AI gia sư kiểu Socratic, hỏi để con tự nghĩ, không đưa sẵn đáp án.
    - Viết công cụ nhỏ cho việc thật, như một web app tra cứu văn bản hành chính — chính xác đến từng câu chữ.
  profile_comment: "# con người, không phải bot"
  profile_edit: Sửa trên GitHub
  profile:
    element: hỏa
    stack:
      - NestJS, Go, Rust
      - PostgreSQL, Redis
      - Kafka, BullMQ
      - Mobile app
      - Claude API, Claude Code, Antigravity
    focus:
      - AI agent cho ERP
      - Kiến trúc event-driven
      - Sản phẩm chuẩn enterprise

capabilities:
  label: 02 — Tôi làm được gì
  title: Từ bản vẽ kiến trúc đến sản phẩm chạy thật.
  items:
    - slug: /kiến-trúc
      title: Kiến trúc hệ thống lớn
      body: Microservice, event-driven, database-per-service cho một nền tảng ERP đa ngành, đa thương hiệu.
      tech: NestJS · Go · Rust · Mobile · PostgreSQL · Kafka · BullMQ · Redis
    - slug: /ai
      title: Đưa AI vào sản phẩm thật
      body: AI Gateway gọi nghiệp vụ bằng function calling, agent thay giao diện ERP, AI tóm tắt và gợi ý bước tiếp theo trong CRM.
      tech: Claude API · MCP · pgvector
    - slug: /tự-động-hóa
      title: Tự động hóa & đa kênh
      body: Workflow engine dạng DAG, chiến dịch chăm sóc khách hàng, kết nối sàn thương mại điện tử.
      tech: Zalo OA/ZNS · SMS · Email · TikTok Shop · Shopee
    - slug: /dẫn-dắt
      title: Dẫn dắt sản phẩm & đội ngũ
      body: Lập kế hoạch sản phẩm, viết spec, điều phối đội dự án từ PO, frontend đến full-stack.
      tech: Product planning · Spec · Code review
